{% extends 'base.html' %}

{% block content %}

<!-- Page Header -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h1>Add Student 🎓</h1>

        <p class="text-muted">
            Register a new student into the college database.
        </p>

    </div>

</div>

<!-- Add Student Form -->

<div class="card shadow-sm p-4 form-card">

    <h3 class="mb-4">

        <i class="bi bi-person-plus-fill"></i>

        Student Registration Form

    </h3>

    <form action="/insert_student" method="POST">

        <div class="row">

            <!-- Student ID -->

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Student ID
                </label>

                <input type="number"
                       class="form-control"
                       name="student_id"
                       required>

            </div>

            

            <!-- Student Name -->

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Student Name
                </label>

                <input type="text"
                       class="form-control"
                       name="student_name"
                       required>

            </div>

        </div>

        <div class="row">

            <!-- Year -->

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Year
                </label>

                <input type="number"
                       class="form-control"
                       name="year"
                       required>

            </div>

            <!-- Age -->

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Age
                </label>

                <input type="number"
                       class="form-control"
                       name="age"
                       required>

            </div>

            <!-- Address -->

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Address
                </label>

                <input type="text"
                       class="form-control"
                       name="address"
                       required>

            </div>

        </div>

        <!-- Buttons -->

        <div class="mt-3">

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>

                Add Student

            </button>

            <button type="reset"
                    class="btn btn-outline-secondary ms-2">

                Clear

            </button>

        </div>

    </form>

</div>

{% endblock %}
